<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>CRM-Abgleich</title>
<style>
  :root { --bg:#FBF8F3; --ink:#2E241D; --muted:#7A6A5E; --forest:#2F4A3A; --line:#E6DDD1; --warn:#9A3B2A; }
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); width: 320px; margin: 0; padding: 16px; }
  h1 { font: 600 16px Georgia, serif; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 10px; background: var(--forest); color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .row { display: flex; gap: 6px; align-items: center; font-size: 12px; margin-top: 8px; }
  #status { margin-top: 12px; padding: 10px; border-radius: 10px; background: #fff; border: 1px solid var(--line); font-size: 12px; white-space: pre-wrap; min-height: 18px; }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .warn { color: var(--warn); }
</style>
</head>
<body>
  <h1>Kathrins CRM</h1>
  <p>Liest nur. Im doTERRA Office wird nichts verändert.</p>
  <button id="go">Jetzt abgleichen</button>
  <div class="row"><input type="checkbox" id="full" style="width:auto"><span>Bestellhistorie komplett neu laden</span></div>
  <button id="file" style="margin-top:8px;background:#A9844B">Als Datei speichern (ohne CRM-Server)</button>
  <div id="status">Bereit.</div>
  <p id="next" style="margin-top:8px"></p>
  <details>
    <summary>Einrichtung</summary>
    <label for="url">CRM-Adresse</label>
    <input id="url" placeholder="http://127.0.0.1:8787">
    <label for="token">Abgleich-Schlüssel (aus dem CRM, Bereich „Daten")</label>
    <input id="token" type="password" autocomplete="off">
    <label for="months">Bestellhistorie: Monate zurück</label>
    <input id="months" type="number" min="3" max="36">
    <button id="save" style="margin-top:10px;background:#7A6A5E">Speichern</button>
  </details>
  <script src="popup.js" type="module"></script>
</body>
</html>
