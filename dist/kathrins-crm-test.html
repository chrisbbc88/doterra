<style>
/* Ruhige, hochwertige Oberfläche – Farbwelt angelehnt an Kathrins Marke (Ivory, Espresso, Deep Forest). */
:root {
  --bg: #F7F3EC; --surface: #FFFDF9; --surface-2: #F1EBE1; --ink: #2B211B; --ink-2: #5B4C41; --muted: #8A7A6D;
  --line: #E4DACD; --forest: #2F4A3A; --forest-2: #3D5E4B; --forest-soft: #E3ECE5; --gold: #A9844B; --gold-soft: #F3EADB;
  --warn: #9A3B2A; --warn-soft: #F6E3DE; --ok: #2F6B45; --ok-soft: #E1EFE4; --info-soft: #E8EEF3;
  --radius: 14px; --shadow: 0 1px 2px rgba(43,33,27,.05), 0 6px 24px rgba(43,33,27,.05);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1B1714; --surface: #231E1A; --surface-2: #2C2621; --ink: #F1EAE0; --ink-2: #D2C6B8; --muted: #A69786;
    --line: #3A322B; --forest: #8DB79C; --forest-2: #A7CBB3; --forest-soft: #263529; --gold: #D6B47E; --gold-soft: #352C1F;
    --warn: #E59A86; --warn-soft: #3A2420; --ok: #8DC79F; --ok-soft: #22342A; --info-soft: #232C33;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; letter-spacing: .1px; margin: 0; }
h1 { font-size: 28px; } h2 { font-size: 20px; } h3 { font-size: 16px; }
a { color: var(--forest); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; min-height: 40px; }
button:hover { border-color: var(--muted); }
a.btn { display: inline-flex; align-items: center; text-decoration: none; color: inherit; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; min-height: 40px; }
a.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
a.btn:hover { border-color: var(--muted); }
button.primary { background: var(--forest); color: #fff; border-color: var(--forest); font-weight: 600; }
@media (prefers-color-scheme: dark) { button.primary { color: #13201A; } }
button.ghost { background: transparent; }
button.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
button.danger { color: var(--warn); border-color: var(--warn); background: transparent; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
textarea { min-height: 90px; resize: vertical; }
label { display: block; font-size: 13px; color: var(--ink-2); margin: 10px 0 4px; }
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 8px 18px; }
.brand small { display: block; color: var(--muted); font-size: 12px; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--forest); display: inline-block; position: relative; flex: none; }
.brand-mark::after { content: ""; position: absolute; inset: 8px 9px 6px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: var(--bg); }
.brand-mark.big { width: 52px; height: 52px; border-radius: 14px; }
.brand-mark.big::after { inset: 14px 15px 10px; }
#nav a, .bottom-nav a { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
#nav a:hover { background: var(--surface-2); }
#nav a.active { background: var(--forest-soft); color: var(--forest); }
#nav .count { margin-left: auto; font-size: 12px; background: var(--gold-soft); color: var(--gold); border-radius: 999px; padding: 0 8px; }
.side-foot { margin-top: auto; }
.main { min-width: 0; }
.top { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center; padding: 12px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.search { position: relative; flex: 1; max-width: 560px; }
.search-results { position: absolute; top: 46px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); max-height: 60vh; overflow: auto; }
.search-results a { display: flex; justify-content: space-between; gap: 8px; padding: 10px 14px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line); }
.search-results a:hover, .search-results a:focus { background: var(--surface-2); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px; text-decoration: none; background: var(--ok-soft); color: var(--ok); white-space: nowrap; }
.pill.stale { background: var(--gold-soft); color: var(--gold); }
.pill.bad { background: var(--warn-soft); color: var(--warn); }
#view { padding: 24px; max-width: 1240px; outline: none; }
#banner:empty { display: none; }
.banner { margin: 16px 24px 0; padding: 12px 16px; border-radius: 12px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.stale { background: var(--gold-soft); color: var(--ink-2); }
.banner.demo { background: var(--info-soft); color: var(--ink-2); }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head p { color: var(--muted); margin: 4px 0 0; }
.grid { display: grid; gap: 16px; align-content: start; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card > h2, .card > h3 { margin-bottom: 12px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.kpi { cursor: pointer; text-align: left; display: block; width: 100%; padding: 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.kpi:hover { border-color: var(--forest-2); }
.kpi .v { font: 600 28px var(--serif); display: block; margin: 4px 0 2px; }
.kpi .l { font-size: 13px; color: var(--ink-2); }
.kpi .d { font-size: 12px; color: var(--muted); }
.step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.step:first-of-type { border-top: 0; }
.step .n { width: 30px; height: 30px; border-radius: 50%; background: var(--forest); color: var(--bg); display: grid; place-items: center; font-weight: 700; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: space-between; align-items: center; }
.list li:first-child { border-top: 0; }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.badge.forest { background: var(--forest-soft); color: var(--forest); }
.badge.gold { background: var(--gold-soft); color: var(--gold); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.info { background: var(--info-soft); color: var(--ink-2); }
.tag-src { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { border-radius: 999px; padding: 5px 12px; min-height: 34px; font-size: 13px; }
.chip.on { background: var(--forest); color: var(--bg); border-color: var(--forest); }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.empty strong { display: block; color: var(--ink-2); font-family: var(--serif); font-size: 17px; margin-bottom: 4px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.bar { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 8px; }
.bar div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; font-size: 11px; color: var(--muted); }
.bar span.b { width: 100%; max-width: 38px; background: var(--forest-2); border-radius: 6px 6px 2px 2px; min-height: 2px; }
.bar span.b.cur { background: var(--gold); }
.fact { font-size: 13px; padding: 6px 10px; border-left: 3px solid var(--line); margin: 4px 0; background: var(--surface-2); border-radius: 0 8px 8px 0; }
.fact.berechnet { border-color: var(--forest-2); } .fact.annahme { border-color: var(--gold); }
.rec { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; }
.rec dl { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; margin: 8px 0 0; font-size: 14px; }
.rec dt { color: var(--muted); font-size: 13px; }
.rec dd { margin: 0; }
.error { color: var(--warn); font-size: 13px; min-height: 18px; }

    getItem: (k) => (map.has(k) ? map.get(k) : null),
    setItem: (k, v) => { v = String(v); map.set(k, v); persist((st) => st.put(v, k)); },

    flush: () => chain,

})();
const LS = 'crmtest:';
const RULES_JSON = "{\n  \"_hinweis\": \"Versionierte Rangbedingungen. Jede Version hat Quelle, Gültigkeit und Prüfdatum. Werte mit null sind NICHT geprüft und werden nicht berechnet. Neue Version anlegen statt alte zu überschreiben, damit historische Auswertungen nachvollziehbar bleiben.\",\n  \"versions\": [\n    {\n      \"version\": \"2026-11-10-office\",\n      \"markt\": \"DE (doTERRA Europe)\",\n      \"gueltigAb\": \"2026-11-01\",\n      \"gueltigBis\": null,\n      \"geprueftAm\": \"2026-11-10\",\n      \"quelle\": \"doTERRA Office, Rank Tracker (Konto 15267863), Ansicht 'Ziel-Rang' am 10.11.2026\",\n      \"rangfolge\": [\"Consultant\", \"Manager\", \"Director\", \"Executive\", \"Elite\", \"Premier\", \"Silver\", \"Gold\", \"Platinum\", \"Diamond\", \"Blue Diamond\", \"Presidential Diamond\"],\n      \"raenge\": {\n        \"Premier\": {\n          \"status\": \"geprüft\",\n          \"persoenlichesLrpPv\": 100,\n          \"ov\": 5000,\n          \"tgv\": 400,\n          \"beine\": { \"anzahl\": 2, \"rang\": \"Executive\" },\n          \"beleg\": \"Rank Tracker Bein-Ansicht mit Ziel-Rang Premier: OV-Ziel 5.000, PV-Ziel 100, 'Anforderung an das Bein 2', TGV-Ziel 400, '2 Executive Beine erforderlich'\"\n        },\n        \"Gold\": {\n          \"status\": \"geprüft\",\n          \"persoenlichesLrpPv\": 100,\n          \"ov\": null,\n          \"tgv\": 600,\n          \"beine\": { \"anzahl\": 3, \"rang\": \"Premier\" },\n          \"beleg\": \"Rank Tracker Hauptansicht Ziel-Rang Gold: PV-Ziel 100, 'Beine 0/3', TGV-Ziel 600; Beine je mit Ziel-Rang Premier\"\n        },\n        \"Consultant\": { \"status\": \"ungeprüft\" },\n        \"Manager\": { \"status\": \"ungeprüft\" },\n        \"Director\": { \"status\": \"ungeprüft\" },\n        \"Executive\": { \"status\": \"ungeprüft\" },\n        \"Elite\": { \"status\": \"ungeprüft\" },\n        \"Silver\": { \"status\": \"ungeprüft\" },\n        \"Platinum\": { \"status\": \"ungeprüft\" },\n        \"Diamond\": { \"status\": \"ungeprüft\" },\n        \"Blue Diamond\": { \"status\": \"ungeprüft\" },\n        \"Presidential Diamond\": { \"status\": \"ungeprüft\" }\n      }\n    }\n  ]\n}\n";
globalThis.process = { env: {}, argv: [], pid: 1 };
globalThis.Buffer = { concat: (arr) => ({ toString: () => arr.map((c) => c.s).join('') }), isBuffer: () => false };
function demoHash(s) { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0'); }

const NODE = {
  crypto: {
    randomUUID: () => crypto.randomUUID(),
    randomBytes: (n) => { const a = crypto.getRandomValues(new Uint8Array(n)); return { toString: (enc) => enc === 'hex' ? [...a].map((b) => b.toString(16).padStart(2, '0')).join('') : b64url(a) }; },
    scryptSync: () => { throw new Error('nicht im Browser'); }, timingSafeEqual: (a, b) => a === b,

    mkdirSync: () => {}, readdirSync: () => [], statSync: () => ({ size: 0, mtime: new Date(), isDirectory: () => false }), unlinkSync: () => {},
    createReadStream: () => { throw new Error('nicht im Browser'); },

  path: {

function patchUtil(U) {

  U.hashPin = (pin) => { const salt = U.token(8); return salt + ':' + demoHash(salt + String(pin)); };
  U.verifyPin = (pin, stored) => { if (!stored) return false; const [salt, h] = stored.split(':'); return demoHash(salt + String(pin)) === h; };
}
function makeBrowserStore(S, U) {
  const KEEP = 10;
  return class BrowserStore {
    constructor(dir) { this.dir = dir; this.key = LS + dir + '/db.json'; this.bkey = LS + dir + '/backups'; this.db = this.load(); }
    load() {
      const raw = KV.getItem(this.key);
      if (!raw) { const db = S.emptyDb(); KV.setItem(this.key, JSON.stringify(db)); return db; }
      const db = S.migrate(JSON.parse(raw)); const e = S.validateDb(db); if (e.length) throw new Error('Datenbank ungültig: ' + e.join('; ')); return db;
    }

    _put(list) { while (true) { try { KV.setItem(this.bkey, JSON.stringify(list)); return; } catch (e) { if (!list.length) throw e; list.pop(); } } }
    _free() { const l = this._list(); l.splice(1); this._put(l); }
    backup(reason = 'manuell') {
      const stamp = new Date().toISOString().replace(/[:.]/g, '-');
      const name = 'db-' + stamp + '-' + reason.replace(/[^a-z0-9-]/gi, '') + '.json';
      const data = JSON.stringify(this.db);
      const list = this._list(); list.unshift({ name, at: new Date().toISOString(), size: data.length, data });

    }

const M_util = (() => {
// Hilfsfunktionen ohne externe Abhängigkeiten.
const { randomUUID, randomBytes, scryptSync, timingSafeEqual } = NODE.crypto;
const fs = NODE.fs;
const path = NODE.path;

const TZ = 'Europe/Berlin';

const uid = () => randomUUID();
const token = (n = 24) => randomBytes(n).toString('base64url');

/** "26,683.50" -> 26683.5 ; "" / "--" / null -> null (fehlend, NICHT 0) */
function parseNum(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).replace(/[\u00ad\u200b-\u200d\ufeff]/g, '').trim().replace(/\s/g, '');
  if (s === '' || s === '--' || s === '-' || s === '—') return null;
  const neg = /^\(.*\)$/.test(s) || s.startsWith('-');
  const clean = s.replace(/[()\-+]/g, '').replace(/,/g, '').replace(/[^\d.]/g, '');
  if (clean === '' || isNaN(Number(clean))) return null;
  const n = Number(clean);
  return neg ? -n : n;
}

/** US-Datum "10/17/2023" -> "2023-10-17"; leer -> null */
function parseUSDate(v) {
  if (!v) return null;
  const m = String(v).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const [, mo, d, y] = m;
  return `${y}-${mo.padStart(2, '0')}-${d.padStart(2, '0')}`;
}

/** PV-Periode "8/2026" oder "11/2026" -> "2026-08" */
function parsePeriod(v) {
  if (!v) return null;
  const m = String(v).trim().match(/^(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  return `${m[2]}-${m[1].padStart(2, '0')}`;
}

const MONTHS = {
  januar: 1, january: 1, februar: 2, february: 2, märz: 3, maerz: 3, march: 3, april: 4,
  mai: 5, may: 5, juni: 6, june: 6, juli: 7, july: 7, august: 8, september: 9,
  oktober: 10, october: 10, november: 11, dezember: 12, december: 12,
};
/** "November 2026" -> "2026-11" */
function parseMonthLabel(v) {
  const m = String(v || '').trim().toLowerCase().match(/^([a-zäöü]+)\s+(\d{4})$/);
  if (!m || !MONTHS[m[1]]) return null;
  return `${m[2]}-${String(MONTHS[m[1]]).padStart(2, '0')}`;
}

/** Kalenderdatum in Europe/Berlin als YYYY-MM-DD */
function localDate(d = new Date()) {
  return new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
}
const localMonth = (d = new Date()) => localDate(d).slice(0, 7);

function addMonths(ym, n) {

}

}

  if (!a || !b) return null;
  return Math.round((new Date(b + 'T12:00:00Z') - new Date(a + 'T12:00:00Z')) / 86400000);
}

function atomicWriteJSON(file, data) {
  fs.mkdirSync(path.dirname(file), { recursive: true });
  const tmp = `${file}.${process.pid}.${Date.now()}.tmp`;
  const fd = fs.openSync(tmp, 'w');
  try {
    fs.writeSync(fd, JSON.stringify(data, null, 1));
    fs.fsyncSync(fd);
  } finally {
    fs.closeSync(fd);
  }
  fs.renameSync(tmp, file);
}

  const out = {};

})();

const M_store = (() => {
// Lokale JSON-Datenbank mit Migrationen, atomarem Speichern und Sicherungen.

const MIGRATIONS = {
  // v1 -> v2: Sammlungen ergänzt
  1: (db) => {
    const base = emptyDb();
    for (const k of Object.keys(base)) if (db[k] === undefined) db[k] = base[k];

}

function validateDb(db) {

  for (const k of ['members', 'memberMonths', 'orders', 'profiles', 'notes', 'tasks', 'settings']) {
    if (typeof db[k] !== 'object' || db[k] === null) errors.push(`Sammlung fehlt: ${k}`);
  }
  for (const [id, m] of Object.entries(db.members || {})) {
    if (m.id !== id) { errors.push(`Mitglied ${id}: ID-Konflikt`); break; }
  }

}

class Store {
  constructor(dir) {
    this.dir = dir;
    this.file = path.join(dir, 'db.json');
    this.backupDir = path.join(dir, 'backups');
    fs.mkdirSync(this.backupDir, { recursive: true });
    this.db = this.load();
  }

  load() {
    if (!fs.existsSync(this.file)) {
      const db = emptyDb();
      atomicWriteJSON(this.file, db);
      return db;
    }
    const raw = JSON.parse(fs.readFileSync(this.file, 'utf8'));
    const db = migrate(raw);
    const errs = validateDb(db);
    if (errs.length) throw new Error('Datenbank ungültig: ' + errs.join('; '));
    return db;
  }

  save() { atomicWriteJSON(this.file, this.db); }

  /** Änderung atomar anwenden: auf Kopie arbeiten, erst bei Erfolg übernehmen. */
  transact(fn) {
    const work = clone(this.db);
    const result = fn(work);
    const errs = validateDb(work);
    if (errs.length) throw new Error('Transaktion verworfen: ' + errs.join('; '));
    this.db = work;
    this.save();
    return result;
  }

  log(action, info = {}) {
    // Protokoll ohne personenbezogene Inhalte: nur Aktion, Zähler, IDs von Läufen
    this.db.audit.push({ at: new Date().toISOString(), action, ...info });
    if (this.db.audit.length > 2000) this.db.audit = this.db.audit.slice(-2000);
  }

  backup(reason = 'manuell') {
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    const name = `db-${stamp}-${reason.replace(/[^a-z0-9-]/gi, '')}.json`;
    atomicWriteJSON(path.join(this.backupDir, name), this.db);
    this.pruneBackups();
    return name;
  }

  listBackups() {
    return fs.readdirSync(this.backupDir)
      .filter((f) => f.endsWith('.json'))
      .map((f) => { const st = fs.statSync(path.join(this.backupDir, f)); return { name: f, size: st.size, at: st.mtime.toISOString() }; })
      .sort((a, b) => b.name.localeCompare(a.name));
  }

  pruneBackups(keep = 60) {
    const list = this.listBackups();
    for (const b of list.slice(keep)) fs.unlinkSync(path.join(this.backupDir, b.name));
  }

  /** Wiederherstellung: prüft die Sicherung, sichert den aktuellen Stand vorher. */
  restore(nameOrData) {
    let data = nameOrData;
    if (typeof nameOrData === 'string') {
      if (!/^[\w.-]+\.json$/.test(nameOrData)) throw new Error('Ungültiger Dateiname');
      data = JSON.parse(fs.readFileSync(path.join(this.backupDir, nameOrData), 'utf8'));
    }
    if (!data || typeof data !== 'object' || typeof data.schemaVersion !== 'number' || typeof data.members !== 'object' || !data.meta) throw new Error('Sicherung ungültig: keine CRM-Sicherung');
    const db = migrate(clone(data));
    const errs = validateDb(db);
    if (errs.length) throw new Error('Sicherung ungültig: ' + errs.join('; '));
    const before = this.backup('vor-wiederherstellung');
    this.db = db;
    this.log('restore', { source: typeof nameOrData === 'string' ? nameOrData : 'upload', safety: before });
    this.save();
    return before;
  }
}

return { SCHEMA_VERSION, emptyDb, migrate, validateDb, Store };

const M_sync = (() => {

// Grundsätze:
//  * Upsert über stabile IDs (Mitglied-ID, Rechnungsnummer) -> keine Duplikate
//  * Nichts wird gelöscht. Fehlende Mitglieder werden nur bei vollständigem Lauf markiert.
//  * Ein unvollständiger/fehlgeschlagener Teil aktualisiert NICHT den "letzten erfolgreichen Abgleich".
//  * Leere Zellen bleiben null (fehlend), 0.00 bleibt 0 (echter Nullwert).
const { uid, parseNum, parseUSDate, parsePeriod, parseMonthLabel, localMonth, diffFields } = M_util;

class StructureError extends Error {
  constructor(msg) { super(msg); this.code = 'structure_changed'; }
}

const norm = (h) => String(h || '').replace(/[\u00ad\u200b-\u200d\ufeff]/g, '').toLowerCase().replace(/[*:]/g, '').replace(/\s+/g, ' ').trim();

// Spaltenüberschrift (de/en) -> internes Feld
const DOWNLINE_FIELDS = {
  'mitglied-id': 'id', 'member id': 'id', 'mitglieds-id': 'id',
  'name': 'name',
  'mitgliedsart': 'memberType', 'member type': 'memberType',
  'levels': 'level', 'level': 'level',
  'derzeitiger rang': 'currentRank', 'current rank': 'currentRank',
  'höchster rang': 'highestRank', 'highest rank': 'highestRank',
  'pv der nächsten treuebestellung': 'nextLrpPv',
  'nächster lrp-termin': 'nextLrpDate', 'next lrp date': 'nextLrpDate',
  'letztes bestelldatum': 'lastOrderDate', 'last order date': 'lastOrderDate',
  'registrierungsdatum': 'entryDate', 'entry date': 'entryDate',
  'id sponsorin': 'sponsorId', 'sponsor id': 'sponsorId',
  'name sponsorin': 'sponsorName',
  'id enrollerin': 'enrollerId', 'enroller id': 'enrollerId',
  'name enrollerin': 'enrollerName',
  'festnetztelefon': 'phoneHome', 'mobiltelefon': 'phoneMobile', 'arbeitshandy': 'phoneWork',
  'adresse': 'address1', 'adresse 2': 'address2', 'e-mail': 'email', 'stadt': 'city',
  'bundesland': 'state', 'postleitzahl': 'zip', 'land': 'country',
};
const REQUIRED_DOWNLINE = ['id', 'name', 'memberType', 'sponsorId', 'enrollerId'];
const MONTH_SUB = { 'ov': 'ov', 'pv': 'pv', 'qual pv': 'qualPv', 'lrp pv': 'lrpPv', 'pgv': 'pgv', 'tgv': 'tgv' };
const TRACKED = ['name', 'memberType', 'currentRank', 'highestRank', 'nextLrpDate', 'nextLrpPv', 'lastOrderDate', 'sponsorId', 'enrollerId', 'level', 'inDownline'];

const MEMBER_TYPE = { 'wellness advocate': 'Beraterin', 'vorteilskunde': 'Vorteilskundin', 'retail customer': 'Einzelhandelskundin', 'wholesale customer': 'Vorteilskundin', 's': 'Sonstige (S)' };

const INVIS = /[\u00ad\u200b-\u200d\ufeff]/g;
function cleanId(v) { const s = String(v ?? '').replace(INVIS, '').trim(); return /^\d{4,}$/.test(s) ? s : null; }

/** Rohzeilen des Downline-Berichts in Mitglieder + Monatswerte übersetzen. */
function parseDownline(payload) {
  const headers = payload.headers || [];
  const map = {};
  const monthCols = [];
  for (const h of headers) {
    const [top, sub] = String(h).split('|');
    if (sub !== undefined) {
      const month = parseMonthLabel(top);
      const field = MONTH_SUB[norm(sub)];
      if (month && field) monthCols.push({ h, month, field });
      continue;
    }
    const f = DOWNLINE_FIELDS[norm(h)];
    if (f) map[h] = f;
  }
  const present = new Set(Object.values(map));
  const missing = REQUIRED_DOWNLINE.filter((f) => !present.has(f));
  if (missing.length) throw new StructureError(`Downline: Pflichtspalten fehlen (${missing.join(', ')}). Seitenstruktur hat sich vermutlich geändert.`);
  if (monthCols.length === 0) throw new StructureError('Downline: keine Monatsspalten gefunden.');

  const members = [], months = [], problems = [];
  for (const row of payload.rows || []) {
    const rec = {};
    for (const [h, f] of Object.entries(map)) rec[f] = row.cells?.[h];
    const id = cleanId(rec.id) || cleanId(String(row.rowId || '').replace(/\D/g, ''));
    if (!id) { problems.push('Zeile ohne gültige Mitglied-ID übersprungen'); continue; }
    const rowIdNum = String(row.rowId || '').replace(/\D/g, '');
    if (rowIdNum && rowIdNum !== id) problems.push(`ID-Abweichung Zeile/Zelle bei ${id}`);
    const typeRaw = clean(rec.memberType);
    members.push({
      id,
      name: clean(rec.name),
      memberTypeRaw: typeRaw,
      memberType: MEMBER_TYPE[norm(typeRaw)] || typeRaw,
      level: parseNum(rec.level),
      currentRank: clean(rec.currentRank),
      highestRank: clean(rec.highestRank),
      nextLrpPv: parseNum(rec.nextLrpPv),
      nextLrpDate: parseUSDate(rec.nextLrpDate),
      lastOrderDate: parseUSDate(rec.lastOrderDate),
      entryDate: parseUSDate(rec.entryDate),
      sponsorId: cleanId(rec.sponsorId),
      sponsorName: clean(rec.sponsorName),
      enrollerId: cleanId(rec.enrollerId),
      enrollerName: clean(rec.enrollerName),
      contact: {
        phoneMobile: clean(rec.phoneMobile), phoneHome: clean(rec.phoneHome), phoneWork: clean(rec.phoneWork),
        email: clean(rec.email), address1: clean(rec.address1), address2: clean(rec.address2),
        zip: clean(rec.zip), city: clean(rec.city), state: clean(rec.state), country: clean(rec.country),
      },
    });
    const byMonth = {};
    for (const c of monthCols) {
      const v = parseNum(row.cells?.[c.h]);
      (byMonth[c.month] ||= {})[c.field] = v;
    }
    for (const [month, vals] of Object.entries(byMonth)) {
      const hasAny = Object.values(vals).some((v) => v !== null);
      if (!hasAny) continue; // komplett leer = keine Daten, kein Nullmonat
      months.push({ id, month, ...vals });
    }
  }
  return { members, months, problems, monthsCovered: [...new Set(monthCols.map((c) => c.month))].sort() };
}

const ORDER_FIELDS = {
  'rechnung': 'invoice', 'invoice': 'invoice', 'art': 'type', 'type': 'type', 'quelle': 'source', 'source': 'source',
  'artikelnummer': 'skus', 'item number': 'skus', 'qty': 'qtys', 'datum': 'date', 'date': 'date',
  'versand': 'shipDate', 'ship date': 'shipDate', 'pvdatum': 'pvMonth', 'pv date': 'pvMonth',
  'volumen': 'volume', 'volume': 'volume', 'betrag': 'amount', 'amount': 'amount',
};
const ORDER_TYPE = { I: 'Beraterbestellung', D: 'Kundenbestellung', R: 'Ersatzbestellung' };
const ORDER_SOURCE = { SO: 'Standardbestellung', IO: 'Internetbestellung', IN: 'Einschreibung', VO: 'Sprachbestellung', AS: 'Treuebestellung (LRP)' };

// Währung der Bestellung nach Land des Mitglieds (Betrag steht in Landeswährung). Unbekannt -> null.
const CURRENCY = { DEU: 'EUR', AUT: 'EUR', ITA: 'EUR', FRA: 'EUR', ESP: 'EUR', NLD: 'EUR', BEL: 'EUR', LUX: 'EUR', IRL: 'EUR', PRT: 'EUR', FIN: 'EUR', GRC: 'EUR', SVK: 'EUR', SVN: 'EUR', EST: 'EUR', LVA: 'EUR', LTU: 'EUR', HRV: 'EUR', BGR: 'BGN', CHE: 'CHF', GBR: 'GBP', POL: 'PLN', CZE: 'CZK', HUN: 'HUF', ROU: 'RON', DNK: 'DKK', SWE: 'SEK', NOR: 'NOK', TUR: 'TRY', USA: 'USD' };
const currencyFor = (country) => CURRENCY[String(country || '').toUpperCase()] || null;

function parseOrderRows(headers, rows, memberId, country) {
  const map = {};
  headers.forEach((h, i) => { const f = ORDER_FIELDS[norm(h)]; if (f) map[f] = i; });
  for (const req of ['invoice', 'date', 'pvMonth', 'volume']) {
    if (map[req] === undefined) throw new StructureError(`Bestellhistorie: Spalte "${req}" fehlt.`);
  }
  const out = [];
  for (const cells of rows) {
    const get = (f) => (map[f] !== undefined ? cells[map[f]] : null);
    const invoice = cleanId(get('invoice'));
    if (!invoice) continue;
    const skus = String(get('skus') || '').split(/[\n;]+/).map((s) => s.trim()).filter(Boolean);
    const qtys = String(get('qtys') || '').split(/[\n;]+/).map((s) => s.trim()).filter(Boolean);
    const items = skus.map((sku, i) => ({ sku, qty: parseNum(qtys[i]) ?? null }));
    const typeCode = clean(get('type'));
    const sourceCode = clean(get('source'));
    const shipDate = parseUSDate(get('shipDate'));
    out.push({
      invoice, memberId,
      typeCode, type: ORDER_TYPE[typeCode] || typeCode,
      sourceCode, source: ORDER_SOURCE[sourceCode] || sourceCode,
      isLrp: sourceCode === 'AS',
      date: parseUSDate(get('date')),
      shipDate,
      pvMonth: parsePeriod(get('pvMonth')),
      volume: parseNum(get('volume')),
      amount: parseNum(get('amount')),
      currency: currencyFor(country),
      items,
      status: shipDate || items.length ? 'ausgeführt' : 'offen',
    });
  }
  return out;
}

// ---------------- Lauf-Verwaltung ----------------

function startRun(db, { kinds, trigger = 'manuell', client = 'extension' }) {
  const id = uid();
  db.syncRuns[id] = {
    id, kinds, trigger, client, startedAt: new Date().toISOString(), finishedAt: null,
    status: 'läuft', parts: {}, errors: [], checks: [],
  };
  for (const k of kinds) {
    db.areaStatus[k] = { ...(db.areaStatus[k] || {}), lastAttemptAt: db.syncRuns[id].startedAt, lastRunId: id, lastStatus: 'läuft' };
  }
  return db.syncRuns[id];
}

function addChange(db, runId, type, memberId, detail) {
  const id = uid();
  db.changes[id] = { id, runId, at: new Date().toISOString(), type, memberId: memberId || null, detail };
}

function markPart(db, run, kind, status, info) {
  run.parts[kind] = { status, at: new Date().toISOString(), ...info };
  const a = db.areaStatus[kind] || {};
  a.lastAttemptAt = run.parts[kind].at;
  a.lastStatus = status;
  a.lastRunId = run.id;
  if (status === 'vollständig') a.lastSuccessAt = run.parts[kind].at;
  db.areaStatus[kind] = a;
}

/** Downline-Teil einspielen */
function ingestDownline(db, runId, part) {
  const run = db.syncRuns[runId];
  if (!run) throw new Error('Unbekannter Abgleichlauf');
  const parsed = parseDownline(part);
  const now = new Date().toISOString();
  const seen = new Set();
  let created = 0, updated = 0;
  for (const m of parsed.members) {
    if (db.suppressed[m.id]) continue;
    seen.add(m.id);
    const prev = db.members[m.id];
    const next = { ...(prev || {}), ...m, inDownline: true, missingSince: null, lastSeenAt: now, lastRunId: runId };
    if (!prev) {
      next.firstSeenAt = now;
      created++;
      // Erste Befüllung erzeugt keine "neu"-Meldungen, sonst wären alle 334 neu.
      if (db.meta.initialSyncDone) addChange(db, runId, 'neues_mitglied', m.id, { name: m.name, art: m.memberType, eingeschrieben: m.entryDate });
    } else {
      const d = diffFields(prev, next, TRACKED);
      if (Object.keys(d).length) {
        updated++;
        next.history = [...(prev.history || []), { at: now, runId, changes: d }].slice(-50);
        addChange(db, runId, 'mitglied_geändert', m.id, d);
      }
    }
    db.members[m.id] = next;
  }
  if (part.focusId && cleanId(part.focusId)) db.settings.ownerId = part.focusId;

  for (const mm of parsed.months) {
    if (db.suppressed[mm.id]) continue;
    const key = `${mm.id}|${mm.month}`;
    const prev = db.memberMonths[key];
    const vals = { ov: mm.ov ?? null, pv: mm.pv ?? null, qualPv: mm.qualPv ?? null, lrpPv: mm.lrpPv ?? null, pgv: mm.pgv ?? null, tgv: mm.tgv ?? null };
    if (!prev) db.memberMonths[key] = { id: mm.id, month: mm.month, ...vals, firstObservedAt: now, observedAt: now };
    else {
      const changed = Object.keys(vals).some((k) => prev[k] !== vals[k]);

    }

  const expected = Number(part.expectedTotal);

  // (doTERRA zählt z. B. Mitgliedsart "S" nicht mit -> eine Zeile mehr ist kein Fehler, wird aber vermerkt.)
  const complete = part.complete === true && Number.isFinite(expected) && received >= expected;

/** Schlagdistanz: Teamlinien-Zuordnung (Leg-ID) und Monatsrang */
function ingestLegs(db, runId, part) {
  const run = db.syncRuns[runId];
  const H = (part.headers || []).map(norm);
  const idx = (name) => H.indexOf(name);
  const iId = idx('mitglieds-id'), iLeg = idx('leg id'), iLevel = idx('level'), iRank = idx('rang'), iPct = idx('% to rank'), iPv = idx('pv'), iOv = idx('ov');
  if ([iId, iLeg, iRank].some((i) => i < 0)) throw new StructureError('Schlagdistanz: Spalten Mitglieds-ID / Leg ID / Rang fehlen.');
  const month = part.month || localMonth();
  const legCols = H.map((h, i) => [h, i]).filter(([h]) => / beine$/.test(h));
  const now = new Date().toISOString();
  let n = 0;
  for (const cells of part.rows || []) {
    const id = cleanId(cells[iId]);
    if (!id || db.suppressed[id]) continue;
    const legsByRank = {};
    for (const [h, i] of legCols) legsByRank[h.replace(' beine', '')] = parseNum(cells[i]);
    db.legs[`${id}|${month}`] = {
      id, month, legId: cleanId(cells[iLeg]) || (String(cells[iLeg]).trim() === '0' ? '0' : null),
      level: parseNum(cells[iLevel]), monthRank: clean(cells[iRank]),
      pctToRank: parseNum(String(cells[iPct] || '').replace('%', '')),
      targetRank: part.targetRank || null, pv: parseNum(cells[iPv]), ov: parseNum(cells[iOv]),
      legsByRank, observedAt: now,
    };
    n++;
  }
  const expected = Number(part.expectedTotal);
  const complete = part.complete === true && (!Number.isFinite(expected) || n >= expected);
  run.checks.push({ kind: 'legs', check: 'Zeilen Schlagdistanz', quelle: Number.isFinite(expected) ? expected : null, erhalten: n, ok: complete });
  markPart(db, run, 'legs', complete ? 'vollständig' : 'unvollständig', { received: n, month });
  return { received: n, complete };
}

/** Bestellhistorie je Mitglied */
function ingestOrders(db, runId, part) {
  const run = db.syncRuns[runId];
  const now = new Date().toISOString();
  let created = 0, changed = 0, membersComplete = 0, membersIncomplete = 0;
  for (const mem of part.members || []) {
    const memberId = cleanId(mem.memberId);
    if (!memberId || db.suppressed[memberId]) continue;
    const orders = parseOrderRows(part.headers || mem.headers || [], mem.rows || [], memberId, db.members[memberId]?.contact?.country);
    const hadCoverage = !!db.orderCoverage[memberId];
    for (const o of orders) {
      const prev = db.orders[o.invoice];
      if (!prev) {
        db.orders[o.invoice] = { ...o, firstSeenAt: now, lastSeenAt: now };
        created++;
        if (hadCoverage) addChange(db, runId, 'neue_bestellung', memberId, { rechnung: o.invoice, pvMonat: o.pvMonth, volumen: o.volume, lrp: o.isLrp });
      } else {
        const d = diffFields(prev, o, ['status', 'shipDate', 'items', 'volume', 'amount', 'pvMonth', 'typeCode', 'sourceCode', 'date']);
        db.orders[o.invoice] = { ...prev, ...o, lastSeenAt: now, ...(Object.keys(d).length ? { changedAt: now, history: [...(prev.history || []), { at: now, changes: d }].slice(-20) } : {}) };
        if (Object.keys(d).length) { changed++; addChange(db, runId, 'bestellung_geändert', memberId, { rechnung: o.invoice, ...d }); }
      }
    }
    if (mem.complete) {
      membersComplete++;
      const prevCov = db.orderCoverage[memberId];
      db.orderCoverage[memberId] = {
        fromMonth: prevCov?.fromMonth && prevCov.fromMonth < mem.fromMonth ? prevCov.fromMonth : mem.fromMonth,
        fetchedAt: now, lastOrderDateSeen: db.members[memberId]?.lastOrderDate || null,
      };
    } else membersIncomplete++;
  }
  const planned = Number(part.plannedMembers);
  const complete = part.complete === true && membersIncomplete === 0 && (!Number.isFinite(planned) || planned === membersComplete);
  run.checks.push({ kind: 'orders', check: 'Mitglieder mit vollständiger Bestellhistorie', quelle: Number.isFinite(planned) ? planned : null, erhalten: membersComplete, ok: complete });
  markPart(db, run, 'orders', complete ? 'vollständig' : 'unvollständig', { created, changed, membersComplete, membersIncomplete });
  return { created, changed, membersComplete, membersIncomplete, complete };
}

/** Provisionsübersicht (einzige belastbare Geldbeträge) */
function ingestCommissions(db, runId, part) {
  const run = db.syncRuns[runId];
  let n = 0;
  for (const table of part.tables || []) {
    const kind = table.kind === 'secondary' ? 'secondary' : 'primary';
    const H = (table.headers || []).map(norm);
    const iP = H.indexOf('zeitraum'), iE = H.indexOf('verdienst'), iF = H.indexOf('gebühren'), iW = H.indexOf('zurückgehaltener betrag'), iA = H.indexOf('auszuzahlender betrag');
    if (iP < 0 || iE < 0) throw new StructureError('Provisionsübersicht: Spalten fehlen.');
    // Primärbonus: Zeitraum = Monat (MM/YYYY). Sekundärbonus: Zeitraum = Kalenderwoche (WW/YYYY, bis 52/53).
    // Erkennung zusätzlich über Werte > 12, damit Wochen nie als Monate gelesen werden.
    const periods = (table.rows || []).map((c) => String(c[iP] || '').replace(INVIS, '').trim());
    const weekly = kind === 'secondary' || periods.some((p) => Number(p.split('/')[0]) > 12);
    for (const cells of table.rows || []) {

/** Teamstruktur in zwei getrennten Sichten:

    const beraterinnen = ms.filter((m) => m.memberType === 'Beraterin').length + (root.memberType === 'Beraterin' ? 1 : 0);
    const kaeufer = st.filter((s) => (s.curPv ?? 0) > 0).length + ((stats[root.id]?.curPv ?? 0) > 0 ? 1 : 0);
    const all = [...st, stats[root.id]].filter(Boolean);

  const enrollers = {};
  for (const m of Object.values(members)) {
    if (!m.enrollerId || m.inDownline === false) continue;

    neu30: { ids: sel((s, m) => m.entryDate && daysBetween(m.entryDate, ctx.today) <= 30 && m.id !== owner) },
    kaeuferMonat: { ids: sel((s, m) => (s.curPv ?? 0) > 0 && m.id !== owner) },
    lrpMonat: { ids: sel((s, m) => (s.curLrp ?? 0) > 0 && m.id !== owner) },
    lrpAktiv: { ids: sel((s, m) => s.hasLrp && m.id !== owner) },
    lrpUeberfaellig: { ids: sel((s) => s.lrpOverdue) },
    wiederbestellquote: { wert: activePrev2.length ? stayed.length / activePrev2.length : null, einheit: '%', basis: `${stayed.length} von ${activePrev2.length} (${prev2} → ${prev1})`, ids: stayed },
    eigenesPv: { wert: owner ? monthVal(db, owner, ctx.month, 'pv') ?? null : null, einheit: 'PV', vormonat: owner ? monthVal(db, owner, prev1, 'pv') ?? null : null },
    eigenesOv: { wert: owner ? monthVal(db, owner, ctx.month, 'ov') ?? null : null, einheit: 'OV', vormonat: owner ? monthVal(db, owner, prev1, 'ov') ?? null : null },
    provision: { wert: lastComm ? lastComm.payout : null, einheit: lastComm?.currency || 'EUR', monat: lastComm?.month || null },
  };
  for (const [k, v] of Object.entries(res)) {
    v.label = KPI_DEFS[k].label; v.def = KPI_DEFS[k].def;
    if (v.wert === undefined) { v.wert = v.ids.length; v.einheit = 'Personen'; }
  }
  return res;
}

/** Monatsverlauf (letzte 6 abgeschlossene + laufender Monat) für Kontoinhaberin und Team */
function trend(db, ctx) {
  const months = [...ctx.closed].reverse().concat(ctx.month);
  const owner = ctx.ownerId;
  return months.map((mo) => {
    let buyers = 0, lrp = 0, neu = 0;
    for (const m of Object.values(db.members)) {
      if (m.id === owner) continue;
      if ((monthVal(db, m.id, mo, 'pv') ?? 0) > 0) buyers++;
      if ((monthVal(db, m.id, mo, 'lrpPv') ?? 0) > 0) lrp++;
      if (m.entryDate && m.entryDate.slice(0, 7) === mo) neu++;
    }
    const c = db.commissions[`${mo}|primary`];
    return { monat: mo, laufend: mo === ctx.month, eigenesPv: owner ? monthVal(db, owner, mo, 'pv') ?? null : null, ov: owner ? monthVal(db, owner, mo, 'ov') ?? null : null, kaeufer: buyers, lrp, neu, provisionEUR: c ? c.payout : null };
  });
}

/** Rangplanung: aktueller Stand vs. versionierte Zielbedingungen */
function rankPlan(db, ctx, team, targetRank = 'Gold') {
  const version = RULES.versions.find((v) => v.gueltigAb <= ctx.today && (!v.gueltigBis || v.gueltigBis >= ctx.today)) || RULES.versions[0];
  const rule = version.raenge[targetRank];
  const owner = ctx.ownerId;
  const me = db.members[owner];
  const strikeMe = db.legs[`${owner}|${ctx.month}`];
  const base = { zielRang: targetRank, regelVersion: version.version, quelle: version.quelle, geprueftAm: version.geprueftAm, status: rule?.status || 'unbekannt' };
  if (!rule || rule.status !== 'geprüft') return { ...base, hinweis: `Für ${targetRank} liegen keine geprüften Bedingungen vor. Angezeigt wird nur die von doTERRA berechnete Schlagdistanz.`, schlagdistanz: strikeMe || null };
  const pv = monthVal(db, owner, ctx.month, 'lrpPv');
  const tgv = monthVal(db, owner, ctx.month, 'tgv');
  const ov = monthVal(db, owner, ctx.month, 'ov');
  const order = version.rangfolge;
  const needIdx = rule.beine ? order.indexOf(rule.beine.rang) : -1;
  const legsMeeting = team.legs.filter((l) => {
    const r = l.monatsrang || l.rang;
    const i = order.indexOf(r);
    return i >= 0 && i >= needIdx;
  });
  const bedingungen = [
    { bedingung: `Persönliches LRP-PV ≥ ${rule.persoenlichesLrpPv}`, ist: pv ?? null, soll: rule.persoenlichesLrpPv, erfuellt: pv != null ? pv >= rule.persoenlichesLrpPv : null, art: 'beobachtet' },
    rule.tgv != null && { bedingung: `TGV ≥ ${rule.tgv}`, ist: tgv ?? null, soll: rule.tgv, erfuellt: tgv != null ? tgv >= rule.tgv : null, art: 'beobachtet' },
    rule.ov != null && { bedingung: `OV ≥ ${rule.ov}`, ist: ov ?? null, soll: rule.ov, erfuellt: ov != null ? ov >= rule.ov : null, art: 'beobachtet' },
    rule.beine && { bedingung: `${rule.beine.anzahl} Beine mit Rang ${rule.beine.rang} oder höher`, ist: legsMeeting.length, soll: rule.beine.anzahl, erfuellt: legsMeeting.length >= rule.beine.anzahl, art: 'berechnet', details: legsMeeting.map((l) => l.name) },
  ].filter(Boolean);
  const naechsteBeine = team.legs.filter((l) => !legsMeeting.includes(l)).sort((a, b) => (b.prozentZumRang ?? 0) - (a.prozentZumRang ?? 0)).slice(0, 4)
    .map((l) => ({ name: l.name, rootId: l.rootId, monatsrang: l.monatsrang, ov: l.ovSchlagdistanz ?? l.ov, prozentZumRang: l.prozentZumRang, bezugsrang: l.schlagdistanzZiel }));
  return { ...base, monat: ctx.month, aktuellerRang: { bezahlt: null, bezahltHinweis: 'Letzter bezahlter Rang wird noch nicht abgeglichen (nur im Rank Tracker sichtbar).', hoechster: me?.highestRank || null, derzeitig: me?.currentRank || null, monatsqualifikation: strikeMe?.monthRank || null }, bedingungen, naechsteBeine,
    hinweis: 'Monatswerte sind laufend und ändern sich bis Monatsende. Empfohlen wird Wachstum über echte Kundennachfrage, keine Vorratskäufe.' };
}

/** Startseite: Was ist heute wichtig? Begrenzte Tagesprioritäten nach verfügbarer Zeit. */
function today(db, ctx, opps) {
  const tasks = Object.values(db.tasks).filter((t) => t.status !== 'erledigt');
  const due = tasks.filter((t) => t.due && t.due <= ctx.today).sort((a, b) => a.due.localeCompare(b.due));
  const followUps = Object.entries(db.profiles).filter(([, p]) => p.followUpDate && p.followUpDate <= ctx.today).map(([key, p]) => ({ contactKey: key, followUpDate: p.followUpDate, nextStep: p.nextStep || null }));
  const minutesPerDay = Math.round((db.settings.weeklyHours || 10) * 60 / 5);
  const steps = [];
  let budget = minutesPerDay;
  const seen = new Set();
  const de = (ymd) => ymd ? ymd.split('-').reverse().join('.') : '';
  // Höchstens 3 Schritte, jede Person nur einmal, innerhalb des Tagesbudgets
  const add = (s) => { if (s.contactKey && seen.has(s.contactKey)) return; if (steps.length < 3 && budget - (s.minuten || 15) >= 0) { steps.push(s); budget -= s.minuten || 15; if (s.contactKey) seen.add(s.contactKey); } };
  for (const t of due) add({ art: 'aufgabe', titel: t.title, taskId: t.id, contactKey: t.contactKey || null, minuten: t.estimateMin || 15, grund: `Fällig am ${de(t.due)}` });
  for (const f of followUps) add({ art: 'wiedervorlage', titel: `Wiedervorlage: ${db.members[f.contactKey]?.name || db.prospects[f.contactKey]?.name || f.contactKey}`, contactKey: f.contactKey, minuten: 15, grund: f.nextStep || `Wiedervorlage ${de(f.followUpDate)}` });
  const done = new Set(Object.values(db.tasks).filter((t) => t.origin).map((t) => t.origin));
  for (const o of opps) if (!done.has(o.id)) add({ art: 'vorschlag', titel: o.titel, contactKey: o.memberId, opportunityId: o.id, minuten: 15, grund: o.beobachtung });
  return { due, followUps, steps, minutesPerDay };
}

function goalsProgress(db, ctx, stats) {
  const out = [];
  for (const g of Object.values(db.goals)) {
    if (g.month !== ctx.month) continue;
    let ist = null;
    if (g.metric === 'neue_mitglieder') ist = Object.values(db.members).filter((m) => m.entryDate?.slice(0, 7) === ctx.month && m.id !== ctx.ownerId).length;
    else if (g.metric === 'lrp_personen') ist = Object.values(stats).filter((s) => (s.curLrp ?? 0) > 0 && s.id !== ctx.ownerId).length;
    else if (g.metric === 'aktive_kaeufer') ist = Object.values(stats).filter((s) => (s.curPv ?? 0) > 0 && s.id !== ctx.ownerId).length;
    else if (g.metric === 'ov') ist = monthVal(db, ctx.ownerId, ctx.month, 'ov') ?? null;
    else if (g.metric === 'veranstaltungen') ist = Object.values(db.events).filter((e) => e.date?.slice(0, 7) === ctx.month).length;
    else if (g.metric === 'manuell') ist = g.manualValue ?? null;
    const [y, mo] = ctx.month.split('-').map(Number);
    const daysInMonth = new Date(Date.UTC(y, mo, 0)).getUTCDate();
    const dayOfMonth = Number(ctx.today.slice(8, 10));
    const sollAnteilig = g.target != null ? g.target * dayOfMonth / daysInMonth : null;
    out.push({ ...g, ist, sollAnteilig, aufmerksamkeit: ist != null && sollAnteilig != null && ist < sollAnteilig * 0.8 });
  }
  return out;
}

function eventOutcome(db, ev) {
  const keys = ev.participants || [];
  const after = (d, n) => d && ev.date && d >= ev.date && daysBetween(ev.date, d) <= n;
  const eingeschrieben = keys.filter((k) => after(db.members[k]?.entryDate, 30));
  const bestellt = keys.filter((k) => Object.values(db.orders).some((o) => o.memberId === k && after(o.date, 30)));
  return { teilnehmende: keys.length, eingeschrieben30: eingeschrieben, bestellt30: bestellt, hinweis: 'Gezählt werden nur Teilnehmende, die im CRM mit einer doTERRA-ID verknüpft sind.' };
}

function computeAll(db, ref = new Date()) {
  const ctx = context(db, ref);
  const stats = memberStats(db, ctx);
  const team = teamStructure(db, ctx, stats);
  const products = productStats(db, ctx);
  const opps = opportunities(db, ctx, stats, products);
  return { ctx, stats, team, products, opps, kpis: kpis(db, ctx, stats), trend: trend(db, ctx) };
}

return { KPI_DEFS, context, memberStats, teamStructure, productStats, opportunities, kpis, trend, rankPlan, today, goalsProgress, eventOutcome, computeAll };

const M_notes = (() => {
// Schnellnotizen in natürlicher Sprache -> Vorschlag (Kontakt, Notiz, Aufgabe).
// Deterministisch und offline. Unsicheres wird als Rückfrage markiert, nie still gespeichert.
const { addDays, normName } = M_util;

const WEEKDAYS = { montag: 1, dienstag: 2, mittwoch: 3, donnerstag: 4, freitag: 5, samstag: 6, sonntag: 0 };
const WD_NAMES = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

function weekday(ymd) { return new Date(ymd + 'T12:00:00Z').getUTCDay(); }
function fmtDate(ymd) { const [y, m, d] = ymd.split('-'); return `${WD_NAMES[weekday(ymd)]}, ${d}.${m}.${y}`; }

/** Erkennt Datumsangaben relativ zu "heute" (YYYY-MM-DD, Europe/Berlin). */
function resolveDates(text, today) {
  const t = text.toLowerCase();
  const found = [];
  const add = (phrase, date, options) => found.push({ phrase, date, ambiguous: !!options, options: options || null });
  if (/\bübermorgen\b/.test(t)) add('übermorgen', addDays(today, 2));
  else if (/\bmorgen\b/.test(t)) add('morgen', addDays(today, 1));
  if (/\bheute\b/.test(t)) add('heute', today);
  let m;
  const reIn = /\bin (\d+|einer|einem|zwei|drei|vier) (tag|tagen|woche|wochen)\b/g;
  const words = { einer: 1, einem: 1, zwei: 2, drei: 3, vier: 4 };
  while ((m = reIn.exec(t))) { const n = words[m[1]] ?? Number(m[1]); add(m[0], addDays(today, m[2].startsWith('woche') ? n * 7 : n)); }
  const reWd = /\b(nächste[nm]?|kommende[nm]?|am|diese[nm]?)?\s*(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)\b/g;
  while ((m = reWd.exec(t))) {
    const target = WEEKDAYS[m[2]];
    const cur = weekday(today);
    let diff = (target - cur + 7) % 7;
    if (diff === 0) diff = 7;
    const first = addDays(today, diff);
    const mod = m[1] || '';
    // "nächsten Dienstag": liegt der Tag noch in dieser Woche (Mo–So), ist unklar, ob diese oder nächste Woche gemeint ist.
    const daysToSunday = (7 - cur) % 7;
    if (/nächst/.test(mod) && diff <= daysToSunday) add(m[0].trim(), null, [first, addDays(first, 7)]);
    else add(m[0].trim(), first);
  }
  const reDate = /\b(\d{1,2})\.(\d{1,2})\.(\d{2,4})?/g;
  while ((m = reDate.exec(text))) {
    const d = m[1].padStart(2, '0'), mo = m[2].padStart(2, '0');
    let y = m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : today.slice(0, 4);
    let date = `${y}-${mo}-${d}`;
    if (!m[3] && date < today) date = `${Number(y) + 1}-${mo}-${d}`;
    if (!isNaN(new Date(date + 'T12:00:00Z'))) add(m[0], date);
  }
  return found;
}

/** Kontaktvorschläge über Namensbestandteile. Kein automatisches Zusammenführen. */
function matchContacts(text, db) {
  const tokens = [...text.matchAll(/\b[A-ZÄÖÜ][a-zäöüß]+(?:-[A-ZÄÖÜ][a-zäöüß]+)?\b/g)].map((m) => normName(m[0]));
  const stop = new Set(['der', 'die', 'das', 'sie', 'er', 'wir', 'ich', 'yoga', 'instagram', 'testwoche', 'montag', 'dienstag', 'mittwoch', 'donnerstag', 'freitag', 'samstag', 'sonntag', 'nächsten', 'heute', 'morgen', 'workshop', 'beim', 'am', 'mit']);
  const want = tokens.filter((t) => !stop.has(t));
  const people = [
    ...Object.values(db.members).filter((m) => m.inDownline !== false).map((m) => ({ key: m.id, name: m.name, art: m.memberType, quelle: 'doTERRA', entryDate: m.entryDate || null, city: m.contact?.city || null })),
    ...Object.entries(db.prospects).map(([key, p]) => ({ key, name: p.name, art: 'Interessentin', quelle: 'CRM' })),
  ];
  const hits = [];
  for (const p of people) {
    const parts = normName(p.name).replace(',', ' ').split(/\s+/).filter(Boolean);
    const score = want.reduce((s, w) => s + (parts.includes(w) ? 1 : 0), 0);
    if (score > 0) hits.push({ ...p, score });
  }
  hits.sort((a, b) => b.score - a.score);
  const best = hits[0]?.score || 0;
  return { candidates: hits.filter((h) => h.score === best).slice(0, 8), tokens: want };
}

const SOURCES = [
  [/\byoga\b/i, 'Yoga'], [/instagram|\binsta\b|\bdm\b/i, 'Instagram'], [/empfehlung|empfohlen/i, 'Empfehlung'],
  [/veranstaltung|workshop|event|abend/i, 'Veranstaltung'], [/kooperation/i, 'Kooperation'],
];
// Gesundheitsbezogene Begriffe: werden nicht automatisch gespeichert, sondern zur Prüfung markiert.
const HEALTH = /krank|schmerz|diagnose|migräne|schlafprobl|depress|angst(?:zust|stör)|schwanger|allergi|entzünd|therapie|medikament|blutdruck|krebs|diabet/i;

function proposeFromNote(text, db, today) {
  const dates = resolveDates(text, today);
  const { candidates } = matchContacts(text, db);
  const sources = SOURCES.filter(([re]) => re.test(text)).map(([, s]) => s);
  const fragen = [];
  if (candidates.length === 0) fragen.push({ typ: 'kontakt', text: 'Keine passende Person gefunden. Neue Interessentin anlegen oder Person auswählen?' });
  else if (candidates.length > 1) fragen.push({ typ: 'kontakt', text: `Mehrere Personen passen (${candidates.map((c) => c.name).join(' · ')}). Welche ist gemeint?` });
  const terminDates = dates.filter((d) => d.date || d.options);
  const amb = terminDates.find((d) => d.ambiguous);
  if (amb) fragen.push({ typ: 'datum', text: `"${amb.phrase}": ${fmtDate(amb.options[0])} oder ${fmtDate(amb.options[1])}?`, options: amb.options });
  if (terminDates.filter((d) => !d.ambiguous).length > 1) fragen.push({ typ: 'datum', text: 'Mehrere Daten erkannt – welches ist der Termin?', options: terminDates.filter((d) => d.date).map((d) => d.date) });
  const sensibel = HEALTH.test(text);
  if (sensibel) fragen.push({ typ: 'sensibel', text: 'Die Notiz enthält möglicherweise Gesundheitsangaben. Bitte nur speichern, was für die Betreuung nötig ist und wofür eine Einwilligung vorliegt.' });
  const gespraech = /sprechen|telefon|anrufen|melden|treffen|termin|gespräch|nachfass/i.test(text);
  const date = terminDates.find((d) => d.date && !d.ambiguous)?.date || null;
  return {
    original: text,
    kandidaten: candidates,
    kontaktEindeutig: candidates.length === 1 ? candidates[0].key : null,
    notiz: { text, quellenHinweis: sources, sensibel },
    aufgabe: gespraech || date ? { title: gespraech ? 'Gespräch führen' : 'Nachfassen', due: date, dueUnsicher: !!amb } : null,
    testwoche: /testwoche|probewoche/i.test(text),
    fragen,
    hinweis: 'Vorschlag – wird erst nach Bestätigung gespeichert.',
  };
}

return { fmtDate, resolveDates, matchContacts, proposeFromNote };

async function callClaude({ apiKey, model, system, user, maxTokens = 1800 }) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01' },
    body: JSON.stringify({ model, max_tokens: maxTokens, system, messages: [{ role: 'user', content: user }] }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(`Claude-API Fehler ${r.status}: ${j?.error?.message || 'unbekannt'}`);
  const text = (j.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('\n');
  return { text, usage: j.usage || null };
}

function extractJson(text) {
  const s = text.indexOf('{'), e = text.lastIndexOf('}');
  if (s < 0 || e < s) return null;
  try { return JSON.parse(text.slice(s, e + 1)); } catch { return null; }
}

/** Prüft Antwort gegen die Datengrundlage: Fakten-IDs müssen existieren, Zahlen werden abgeglichen. */
function validateAnswer(ans, facts) {
  const ids = new Set(facts.map((f) => f.id));
  const allNums = new Set(facts.flatMap((f) => (f.text.match(/\d+(?:[.,]\d+)?/g) || []).map((n) => n.replace(',', '.'))));
  const warn = [];
  const recs = [];
  for (const r of ans?.empfehlungen || []) {
    const refs = (r.fakten || []).filter((id) => ids.has(id));
    if (!refs.length) { warn.push(`Empfehlung "${r.titel}" ohne gültige Datengrundlage verworfen.`); continue; }
    const txt = [r.beobachtung, r.begruendung, r.naechster_schritt].join(' ');
    const nums = (txt.match(/\d+(?:[.,]\d+)?/g) || []).map((n) => n.replace(',', '.'));
    const unbelegt = nums.filter((n) => !allNums.has(n) && Number(n) > 3);
    recs.push({ ...r, fakten: refs, ungepruefteZahlen: [...new Set(unbelegt)] });
  }
  return { ...ans, empfehlungen: recs, pruefhinweise: warn };
}

async function ask(db, apiKey, question, ref = new Date()) {
  const { facts } = buildFacts(db, ref);

}

        if (run) { run.errors.push(e.message); run.parts[b.kind] = { status: e.code === 'structure_changed' ? 'struktur_geändert' : 'fehler', at: new Date().toISOString(), message: e.message };
          d.areaStatus[b.kind] = { ...(d.areaStatus[b.kind] || {}), lastStatus: run.parts[b.kind].status, lastAttemptAt: run.parts[b.kind].at, lastRunId: p.runId }; }
      });
      throw err(422, e.message);
    }
  });
  route('POST', '/api/sync/:runId/finish', 'sync', async (req, res, p) => {
    const b = await readBody(req);
    return store.transact((d) => { const r = sync.finishRun(d, p.runId, { clientStatus: b.status, error: b.error }); store.log('abgleich_ende', { runId: r.id, status: r.status, aenderungen: r.changeCount }); return r; });
  });

  // ---------- HTTP ----------
  async function handler(req, res) {
    try {
      const u = new URL(req.url, 'http://127.0.0.1');
      // Fremde Webseiten dürfen die lokale API nicht ansprechen (CSRF-Schutz).
      const origin = req.headers.origin;
      const host = req.headers.host || '';
      const okOrigin = !origin || origin === `http://${host}` || origin.startsWith('chrome-extension://');
      if (req.method === 'OPTIONS') return send(res, 204, '', { 'access-control-allow-origin': okOrigin && origin ? origin : 'null', 'access-control-allow-headers': 'content-type,x-sync-token,x-requested-with', 'access-control-allow-methods': 'GET,POST,PUT,DELETE' });
      if (!okOrigin) return send(res, 403, { error: 'Herkunft nicht erlaubt' });
      if (!/^(127\.0\.0\.1|localhost)(:\d+)?$/.test(host)) return send(res, 403, { error: 'Nur lokaler Zugriff' });
      if (u.pathname.startsWith('/api/')) {
        for (const r of routes) {
          if (r.method !== req.method) continue;
          const m = u.pathname.match(r.re);
          if (!m) continue;
          const params = Object.fromEntries(r.keys.map((k, i) => [k, m[i + 1]]));
          const who = auth(req);
          if (r.need) {
            if (!who) return send(res, 401, { error: 'Nicht angemeldet' });
            if (!can(who, r.need)) return send(res, 403, { error: 'Keine Berechtigung' });
            // UI-Schreibzugriffe zusätzlich mit eigenem Header (CSRF)
            if (who.role !== 'sync' && req.method !== 'GET' && req.headers['x-requested-with'] !== 'crm') return send(res, 403, { error: 'Anfrage ohne CRM-Kennung' });
          }
          const out = await r.fn(req, res, params, who);
          if (out !== undefined && !res.headersSent) send(res, 200, out);
          return;
        }
        return send(res, 404, { error: 'Unbekannter Endpunkt' });
      }
      // Statische Dateien
      let file = path.normalize(path.join(ROOT, 'public', u.pathname === '/' ? 'index.html' : u.pathname));
      if (!file.startsWith(path.join(ROOT, 'public'))) return send(res, 403, 'Verboten');
      if (!fs.existsSync(file) || fs.statSync(file).isDirectory()) file = path.join(ROOT, 'public', 'index.html');
      const type = { '.html': 'text/html', '.js': 'text/javascript', '.css': 'text/css', '.svg': 'image/svg+xml', '.png': 'image/png', '.json': 'application/json', '.webmanifest': 'application/manifest+json' }[path.extname(file)] || 'application/octet-stream';
      res.writeHead(200, { 'content-type': type + '; charset=utf-8', 'cache-control': 'no-cache', 'x-content-type-options': 'nosniff', 'content-security-policy': "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'", 'x-frame-options': 'DENY', 'referrer-policy': 'no-referrer' });
      fs.createReadStream(file).pipe(res);
    } catch (e) {
      const status = e.status || 500;
      if (status >= 500) console.error('[Fehler]', e.message);
      if (!res.headersSent) send(res, status, { error: e.message });
    }
  }

  // Tägliche Sicherung, solange der Server läuft
  let timer = null;
  const dailyBackup = () => {
    const last = store.listBackups().find((b) => /taeglich|manuell|vor-abgleich/.test(b.name));
    if (!last || daysBetween(last.at.slice(0, 10), localDate()) >= 1) store.backup('taeglich');
  };
  return {
    store, cfg, handler, sessions, // sessions nur für Tests/Rollenverwaltung
    listen(port = Number(env.PORT) || 8787, host = '127.0.0.1') {
      const server = http.createServer(handler);
      dailyBackup();
      timer = setInterval(dailyBackup, 3600 * 1000); timer.unref();
      return new Promise((resolve) => server.listen(port, host, () => resolve(server)));
    },
  };
}

const jar = {};
const realFetch = window.fetch.bind(window);
async function bridge(url, init = {}) {
  const headers = {};
  const h = init.headers || {};
  for (const [k, v] of (h instanceof Headers ? h.entries() : Object.entries(h))) headers[k.toLowerCase()] = v;
  headers.host = '127.0.0.1:8787';
  const ck = Object.entries(jar).map(([k, v]) => k + '=' + v).join('; ');
  if (ck) headers.cookie = ck;
  const body = init.body == null ? '' : String(init.body);
  const listeners = {};
  const req = { method: (init.method || 'GET').toUpperCase(), url, headers, on(ev, cb) { (listeners[ev] ||= []).push(cb); return req; }, destroy() {} };
  setTimeout(() => { if (body) (listeners.data || []).forEach((cb) => cb({ s: body, length: body.length })); (listeners.end || []).forEach((cb) => cb()); }, 0);
  return new Promise((resolve) => {
    let status = 200; const rh = {};
    const res = {
      headersSent: false,
      setHeader(k, v) { rh[k.toLowerCase()] = v; },
      writeHead(c, hh = {}) { status = c; for (const [k, v] of Object.entries(hh)) rh[k.toLowerCase()] = v; this.headersSent = true; },
      end(b) {
        const sc = rh['set-cookie'];
        if (sc) { const [kv] = String(sc).split(';'); const [k, v] = kv.split('='); if (/Max-Age=0/.test(sc) || !v) delete jar[k]; else jar[k] = v; }
        delete rh['set-cookie'];
        resolve(new Response(status === 204 ? null : (b ?? ''), { status, headers: rh }));
      },
    };
    Promise.resolve(APP.handler(req, res)).catch((e) => resolve(new Response(JSON.stringify({ error: e.message }), { status: 500 })));
  });
}
window.fetch = (input, init) => {
  const url = typeof input === 'string' ? input : input.url;
  if (url.startsWith('/api/')) return bridge(url, init);
  if (/api\.anthropic\.com/.test(url)) init = { ...init, headers: { ...(init?.headers || {}), 'anthropic-dangerous-direct-browser-access': 'true' } };

async function refreshStatus() {
  try {
    const s = await api('/api/data/status');
    const bad = s.areas.filter((a) => /fehl|abgelaufen|struktur|unvollst|teilweise/.test(a.lastStatus));
    const stale = s.areas.filter((a) => a.veraltet);
    const pill = $('#dataPill');
    pill.className = 'pill' + (bad.length ? ' bad' : stale.length ? ' stale' : '');
    pill.textContent = bad.length ? 'Abgleich-Problem' : stale.length ? (s.areas.every((a) => !a.lastSuccessAt) ? 'Noch kein Abgleich' : 'Daten veraltet') : `Stand ${fmtDT(s.areas[0].lastSuccessAt)}`;
    let html = '';
    if (s.demo) html += `<div class="banner demo"><span><strong>Beispieldaten.</strong> Diese Instanz enthält erfundene Testdaten und ist vom echten Datenbestand getrennt.</span></div>`;
    const lastRun = s.runs[0];
    if (lastRun && lastRun.status === 'sitzung_abgelaufen') html += `<div class="banner warn"><span><strong>doTERRA-Anmeldung abgelaufen.</strong> Der letzte Abgleich (${fmtDT(lastRun.startedAt)}) konnte nicht lesen. Bitte im doTERRA Office anmelden und den Abgleich in der Erweiterung neu starten.</span><a href="#/daten">Details</a></div>`;
    else if (lastRun && lastRun.status === 'struktur_geändert') html += `<div class="banner warn"><span><strong>doTERRA hat eine Seite verändert.</strong> Betroffene Daten wurden nicht überschrieben. Der Abgleich muss angepasst werden.</span><a href="#/daten">Details</a></div>`;
    else if (bad.length) html += `<div class="banner warn"><span><strong>Abgleich nicht vollständig:</strong> ${bad.map((a) => esc(a.label)).join(', ')}. Es werden die letzten vollständigen Daten angezeigt.</span><a href="#/daten">Details</a></div>`;
    else if (stale.length && !s.areas.every((a) => !a.lastSuccessAt)) html += `<div class="banner stale"><span><strong>Daten veraltet:</strong> ${stale.map((a) => `${esc(a.label)} (${a.lastSuccessAt ? 'Stand ' + fmtDT(a.lastSuccessAt) : 'nie'})`).join(' · ')}</span><a href="#/daten">Abgleich</a></div>`;
    $('#banner').innerHTML = html;
  } catch {}
}

    </div>

  $('#prof').onsubmit = async (e) => {

    await api(`/api/contacts/${encodeURIComponent(key)}/profile`, { method: 'PUT', body }); toast('Profil gespeichert');

  $('#addNote').onclick = () => noteDialog({ contactKey: key, name });

  const da = $('#delAll'); if (da) da.onclick = async () => { if (confirm('Person lokal vollständig löschen und vom künftigen Abgleich ausschließen? Im doTERRA-Konto ändert sich nichts.')) { await api('/api/contacts/' + encodeURIComponent(key) + '?source=1', { method: 'DELETE' }); toast('Lokal gelöscht'); go('#/kontakte'); } };

// ---------------- Schnellnotiz ----------------
function noteDialog(pre = {}) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  modal(`<h2>Schnelle Notiz</h2><p class="small muted">In eigenen Worten, z. B. „Silke war beim Yoga dabei, hat eine Testwoche gemacht und möchte nächsten Dienstag noch einmal sprechen."</p>
    <textarea id="nt" placeholder="Was ist passiert?">${pre.name ? esc(pre.name.split(',').reverse().join(' ').trim()) + ' ' : ''}</textarea>
    <div class="actions">${SR ? '<button class="small" id="dict">🎙 Diktieren</button>' : ''}<label class="small" style="margin:0;display:inline-flex;gap:6px;align-items:center"><input type="file" accept="audio/*" id="audio" style="width:auto"> Sprachmemo</label></div>
    <p class="tiny muted" id="audioHint">${SR ? 'Diktieren nutzt die Spracherkennung von Chrome (Audio wird dabei von Google verarbeitet).' : ''}</p>
    <div class="actions"><button class="primary" id="propose">Vorschlag erstellen</button><button id="ncancel">Abbrechen</button></div><div id="proposal"></div>`, (el) => {
    $('#ncancel', el).onclick = closeModal;
    const ta = $('#nt', el); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    $('#audio', el).onchange = () => { $('#audioHint', el).innerHTML = '<span class="error">Transkription von Sprachmemos ist vorbereitet, aber noch nicht eingerichtet (geplant: lokale Transkription). Bitte vorerst diktieren oder tippen.</span>'; };
    if (SR) $('#dict', el).onclick = () => { const r = new SR(); r.lang = 'de-DE'; r.interimResults = false; r.onresult = (e) => { ta.value += (ta.value ? ' ' : '') + e.results[0][0].transcript; }; r.onerror = () => toast('Diktieren nicht möglich'); r.start(); toast('Ich höre zu …'); };
    $('#propose', el).onclick = async () => {
      const text = ta.value.trim(); if (!text) return;
      const p = await api('/api/notes/propose', { body: { text } });
      let chosen = pre.contactKey || p.kontaktEindeutig;
      const datQ = p.fragen.find((f) => f.typ === 'datum');
      $('#proposal', el).innerHTML = `<div class="section card" style="box-shadow:none">
        <h3>Vorschlag – bitte prüfen</h3>
        ${p.fragen.length ? `<div class="hint section">${p.fragen.map((f) => esc(f.text)).join('<br>')}</div>` : ''}
        <label>Kontakt</label>
        ${pre.contactKey ? `<p><strong>${esc(pre.name)}</strong></p>` : p.kandidaten.length ? p.kandidaten.map((k) => `<label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="radio" name="who" value="${esc(k.key)}" style="width:auto" ${chosen === k.key ? 'checked' : ''}> ${esc(k.name)} <span class="badge">${esc(k.art)}</span> <span class="tiny muted">${esc(k.key.startsWith('p:') ? 'CRM' : 'ID ' + k.key)}${k.entryDate ? ' · seit ' + fmtDate(k.entryDate) : ''}${k.city ? ' · ' + esc(k.city) : ''}</span></label>`).join('') + '<label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="radio" name="who" value="__new" style="width:auto"> Neue Interessentin anlegen</label>' : '<label style="display:flex;gap:8px;align-items:center"><input type="radio" name="who" value="__new" style="width:auto" checked> Neue Interessentin anlegen</label>'}
        <label>Notiz</label><textarea id="pnote">${esc(p.notiz.text)}</textarea>
        ${p.notiz.quellenHinweis.length ? `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="psrc" style="width:auto"> Kontaktquelle setzen: ${esc(p.notiz.quellenHinweis[0])} (nur wenn noch leer)</label>` : ''}
        ${p.notiz.sensibel ? '<label style="display:flex;gap:8px;align-items:center" class="error"><input type="checkbox" id="psens" style="width:auto"> Ich bestätige: Die Gesundheitsangabe ist für die Betreuung nötig und es liegt eine Einwilligung vor.</label>' : ''}
        ${p.aufgabe ? `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ptask" style="width:auto" checked> Aufgabe anlegen</label><div class="row"><div><label>Aufgabe</label><input id="ptitle" value="${esc(p.aufgabe.title)}"></div><div><label>Fällig${datQ ? ' – bitte wählen' : ''}</label>${datQ ? `<select id="pdue">${datQ.options.map((d) => `<option value="${d}">${fmtDate(d)}</option>`).join('')}</select>` : `<input id="pdue" type="date" value="${esc(p.aufgabe.due || '')}">`}</div></div>` : ''}
        <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pfollow" style="width:auto" ${p.aufgabe?.due ? 'checked' : ''}> Als Wiedervorlage im Profil setzen</label>
        <div class="actions"><button class="primary" id="psave">Bestätigen &amp; speichern</button></div></div>`;
      $('#psave', el).onclick = async () => {
        let key = pre.contactKey || el.querySelector('input[name=who]:checked')?.value;
        if (!key) return toast('Bitte Kontakt wählen');
        if (p.notiz.sensibel && !$('#psens', el)?.checked) return toast('Sensible Angabe: bitte bestätigen oder Text kürzen');
        if (key === '__new') { const nm = prompt('Name der neuen Interessentin?', ''); if (!nm) return; key = (await api('/api/prospects', { body: { name: nm, source: $('#psrc', el)?.checked ? p.notiz.quellenHinweis[0] : null } })).key; }
        await api('/api/notes', { body: { contactKey: key, text: $('#pnote', el).value, sensitive: !!p.notiz.sensibel, kind: p.testwoche ? 'Testwoche' : 'Gespräch', source: $('#psrc', el)?.checked ? p.notiz.quellenHinweis[0] : null } });
        const due = $('#pdue', el)?.value || null;
        if ($('#ptask', el)?.checked) await api('/api/tasks', { body: { title: $('#ptitle', el).value, contactKey: key, due, estimateMin: 15 } });
        if ($('#pfollow', el)?.checked && due) await api(`/api/contacts/${encodeURIComponent(key)}/profile`, { method: 'PUT', body: { followUpDate: due, nextStep: $('#ptitle', el)?.value || null } });
        closeModal(); toast('Gespeichert'); go('#/kontakt/' + encodeURIComponent(key)); route();
      };
    };
  });
}
$('#quickNote').onclick = () => noteDialog();

VIEWS.aufgaben = async (v) => {
  const tasks = await api('/api/tasks');
  const t0 = today();
  const groups = [['Überfällig', (t) => t.status !== 'erledigt' && t.due && t.due < t0], ['Heute', (t) => t.status !== 'erledigt' && t.due === t0], ['Demnächst', (t) => t.status !== 'erledigt' && t.due && t.due > t0], ['Ohne Datum', (t) => t.status !== 'erledigt' && !t.due], ['Erledigt', (t) => t.status === 'erledigt']];
  v.innerHTML = `<div class="page-head"><div><h1>Aufgaben</h1><p>${tasks.filter((t) => t.status !== 'erledigt').length} offen</p></div><button class="primary" id="nt">+ Aufgabe</button></div>
    ${groups.map(([l, f]) => { const arr = tasks.filter(f).sort((a, b) => (a.due || '').localeCompare(b.due || '')); return arr.length ? `<section class="card section"><h2>${l} <span class="badge">${arr.length}</span></h2><ul class="list">${arr.slice(0, l === 'Erledigt' ? 20 : 200).map((t) => `<li><span>${t.status === 'erledigt' ? '<s>' : ''}${esc(t.title)}${t.status === 'erledigt' ? '</s>' : ''}${t.contactKey ? ' · ' + contactLink(t.contactKey, t.contactName) : ''}<br><span class="tiny muted">${t.due ? fmtDate(t.due) : 'ohne Datum'} · ${t.estimateMin || 15} Min.</span></span><span class="actions" style="margin:0">${t.status !== 'erledigt' ? `<button class="small" data-done="${t.id}">Erledigt</button>` : ''}<button class="small ghost" data-edit="${t.id}">Bearbeiten</button><button class="small ghost" data-del="${t.id}" aria-label="Löschen">✕</button></span></li>`).join('')}</ul></section>` : ''; }).join('') || '<div class="card empty"><strong>Keine Aufgaben</strong>Lege eine an oder übernimm einen Vorschlag von der Startseite.</div>'}`;
  $('#nt').onclick = () => taskForm();
  v.querySelectorAll('[data-done]').forEach((b) => (b.onclick = async () => { await api('/api/tasks/' + b.dataset.done, { method: 'PUT', body: { status: 'erledigt' } }); route(); }));
